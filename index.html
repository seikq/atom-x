<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM-X: Academia Atómica</title>
</head>
<body style="background:#060b18;color:#7de7ff;font-family:sans-serif;text-align:center;padding:40px">
<p id="msg">Cargando ATOM-X...</p>
<script>
(async function(){
  const n = 4;
  let html = "";
  try {
    for (let i = 0; i < n; i++) {
      const r = await fetch("part" + i + ".txt?t=" + Date.now());
      if (!r.ok) throw new Error("part " + i);
      html += await r.text();
      document.getElementById("msg").textContent = "Cargando... " + Math.round((i+1)/n*100) + "%";
    }
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById("msg").textContent = "Error al cargar el juego: " + e.message;
  }
})();
</script>
</body>
</html>
