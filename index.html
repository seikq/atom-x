<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM-X</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#060b18;color:#7de7ff;font-family:system-ui,sans-serif}
.box{text-align:center}.bar{width:240px;height:10px;background:#1a2f4d;border-radius:8px;margin:14px auto;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#00e5ff,#8a35ff)}
</style></head><body>
<div class="box"><div style="font-size:48px">⚛</div><div id="m">Cargando ATOM-X...</div>
<div class="bar"><div class="fill" id="f"></div></div></div>
<script>
(async()=>{
const n=8;let b="";
const m=document.getElementById("m"),f=document.getElementById("f");
try{
for(let i=0;i<n;i++){
const r=await fetch("b"+i+".txt");
if(!r.ok)throw new Error("b"+i);
b+=await r.text();
f.style.width=((i+1)/n*100)+"%";
m.textContent="Cargando... "+Math.round((i+1)/n*100)+"%";
}
const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const html=new TextDecoder().decode(bin);
document.open();document.write(html);document.close();
}catch(e){m.textContent="Error: "+e.message}
})();
</script></body></html>
